---
layout: default
---

<article class="post">
    <div class="container">
        <div class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="post-meta">
                <span>{{ page.date | date: "%B %d, %Y" }}</span>
                {% if page.author %}
                <span>by {{ page.author }}</span>
                {% endif %}
                {% if page.categories %}
                <span>in {{ page.categories | join: ", " }}</span>
                {% endif %}
            </div>
        </div>
        
        <div class="post-content">
            {{ content }}
        </div>
        
        <div class="post-footer">
            <a href="{{ '/blog' | relative_url }}" class="btn btn-outline">← Back to Blog</a>
        </div>
    </div>
</article>
